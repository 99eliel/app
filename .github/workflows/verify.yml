name: Validar portal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos módulos JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in docs/*.js sw.js; do
            echo "Verificando $f"
            node --input-type=module --check < "$f"
          done
      - name: Testar lógica pura de assinaturas
        run: node --experimental-default-type=module --test tests/*.test.mjs
      - name: Confirmar arquivos do GitHub Pages
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/app.js
          test -s docs/firebase.js
          test -s docs/network.js
          test -s docs/admin.js
          test -s docs/billing.js
          test -s docs/license-core.js
          test -s docs/module-catalog.js
          test -s docs/municipal-portal.js
          test -s index.html
          test -s firestore.rules
          test -s docs/account.js
          test -s docs/notice-utils.js
          test -s docs/sw.js
          test -s sw.js

  firestore-security:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 12
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java para emulador
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Firebase Tools e biblioteca de testes
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Compilar regras e testar permissões no emulador Firestore
        run: |
          npx firebase emulators:exec --project demo-conectasaude-ci --only firestore "node --test tests/firestore-emulator.test.mjs"
